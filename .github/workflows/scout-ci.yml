name: Scout CI

on:
  push:
    branches:
      - main
      - feat/discovery-contact-mvp
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run tests and production build
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run migration smoke
        run: python tests/migration-smoke.py

      - name: Run company outreach migration smoke
        run: python tests/company-outreach-migration-smoke.py

      - name: Generate database schema
        run: npm run db:generate

      - name: Verify generated schema is clean
        run: git diff --exit-code

      - name: Verify clean worktree after schema generation
        run: npm run check:clean

      - name: Run final production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Verify final clean worktree
        run: npm run check:clean

      - name: Report release status
        run: |
          git status --short --branch
          git diff --stat
